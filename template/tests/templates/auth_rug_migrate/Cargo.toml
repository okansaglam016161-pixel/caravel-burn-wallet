[package]
name = "auth_rug_migrate"
version = "0.1.0"
edition = "2024"
publish = false

# TEST ONLY — the code an attacker would swap a vault component onto using UpdateComponentTemplate
# WITH a `#[migration]` function: the burn wallet's state layout plus a migration that keeps the
# vault and a withdraw that drains it. Never published.

[workspace]

[dependencies]
tari_template_lib = { version = "0.34" }
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
